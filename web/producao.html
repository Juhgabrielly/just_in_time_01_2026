<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema MDF - Produção</title>
    <link rel="stylesheet" href="producao.css">
</head>
<body>
    <header>
        <div>
            <h1>Sistema MDF</h1>
            <span>Controle de produção e estoque</span>
        </div>
        <div class="usuario-area">
            <span>
                Olá, <strong id="nomeUsuario"></strong>
            </span>
            <button id="btnVoltar">
                Voltar
            </button>
            <button id="btnSair">
                Sair
            </button>
        </div>
    </header>
    <main>
        <div class="topo">
            <div>
                <h2>Produção e Estoque</h2>
                <p>Registre produtos fabricados e pedidos.
                </p>
            </div>
        </div>

        <section class="painel">
            <h3>Nova movimentação</h3>
            <form id="formMovimentacao">
                <div class="campo">
                    <label for="produto">
                        Produto *
                    </label>
                    <select id="produto" required>
                        <option value="">
                            Selecione um produto
                        </option>
                    </select>
                </div>
                <div class="campo">
                    <label for="tipo">
                        Tipo de movimentação *
                    </label>
                    <select id="tipo" required>
                        <option value="">
                            Selecione
                        </option>
                        <option value="FABRICADO">
                            Fabricado
                        </option>
                        <option value="PEDIDO">
                            Pedido
                        </option>
                    </select>
                </div>
                <div class="campo">
                    <label for="quantidade">
                        Quantidade *
                    </label>
                    <input  type="number" id="quantidade" min="1" required>
                </div>
                <div class="campo">
                    <label for="data">
                        Data *
                    </label>
                    <input type="date" id="data" required>
                </div>

                <div class="info-estoque">
                    <span>
                        Estoque atual:
                    </span>
                    <strong id="estoqueAtual">
                        -
                    </strong>
                </div>
                <button type="submit" class="btn-registrar">
                    Registrar movimentação
                </button>
            </form>
        </section>
        <div id="alertaEstoque" class="alerta">
        </div>

        <section class="painel">
            <div class="titulo-tabela">
                <div>
                    <h3>Estoque atual</h3>
                    <p>
                        Produtos ordenados alfabeticamente.
                    </p>
                </div>
                <button id="btnAtualizar">
                    Atualizar
                </button>
            </div>
            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Estoque</th>
                            <th>Estoque mínimo</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="listaEstoque">
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="producao.js"></script>
</body>
</html>
