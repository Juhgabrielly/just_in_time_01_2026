<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema MDF - Produtos</title>
    <link rel="stylesheet" href="produtos.css">
</head>
<body>
    <header>
        <div>
            <h1>Sistema MDF</h1>
            <span>Gerenciamento de produtos</span>
        </div>
        <div class="usuario-area">
            <span>
                Olá, <strong id="nomeUsuario"></strong>
            </span>
            <button id="btnVoltar">
                Voltar
            </button>
            <button id="btnSair">
                Sair
            </button>
        </div>
    </header>
    <main>
        <div class="topo">
            <div>
                <h2>Produtos</h2>
                <p>Cadastre e gerencie os produtos do estoque.</p>
            </div>
            <button id="btnNovoProduto">
                + Novo produto
            </button>
        </div>
        <div class="pesquisa">
            <input type="text" id="campoBusca" placeholder="Pesquisar produto pelo nome.">
            <button id="btnBuscar">
                Buscar
            </button>
            <button id="btnListar">
                Limpar
            </button>
        </div>

        <p id="mensagem"></p>
        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Custo</th>
                        <th>Estoque</th>
                        <th>Estoque mínimo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaProdutos">
                </tbody>
            </table>
        </div>
    </main>

    <div id="modal" class="modal">
        <div class="modal-conteudo">
            <div class="modal-topo">
                <h2 id="tituloModal">
                    Novo produto
                </h2>
                <button id="btnFecharModal">
                    ×
                </button>
            </div>

            <form id="formProduto">
                <input type="hidden" id="produtoId">
                <label for="nome">Nome *
                </label>
                <input type="text" id="nome" required>
                <label for="descricao">
                    Descrição
                </label>
                <textarea id="descricao" rows="3"></textarea>
                <label for="custo">
                    Custo *
                </label>
                <input type="number" id="custo" step="0.01" min="0" required>
                <label for="quant_estoque">
                    Quantidade em estoque *
                </label>
                <input  type="number" id="quant_estoque" min="0" required>
                <label for="estoq_minimo">
                    Estoque mínimo *
                </label>
                <input type="number" id="estoq_minimo" min="0" required>

                <div class="botoes-form">
                    <button type="button" id="btnCancelar">
                        Cancelar
                    </button>
                    <button type="submit">
                        Salvar produto
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script src="produtos.js"></script>
</body>
</html>
